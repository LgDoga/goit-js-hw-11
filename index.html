<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/goit-js-hw-11/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <script type="module" crossorigin src="/goit-js-hw-11/index.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-11/assets/vendor-S2qh7U4E.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-11/assets/vendor-DumFYO8Z.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-11/assets/index-xikFguEb.css">
  </head>
  <body>
    <header class="header">
      <div class="header__mark">
        <span class="header__aperture" aria-hidden="true"></span>
        <span class="header__wordmark">Frame Finder</span>
      </div>
      <p class="header__tag">a contact sheet for anything you can name</p>
    </header>
    
    <main class="main">
      <form class="form" id="search-form">
        <label class="form__label">
          <span class="form__hint">search subject</span>
          <input class="form__input" type="text" name="search-text" placeholder="mountains, coffee, jellyfish…"
            autocomplete="off" required />
        </label>
        <button class="form__button" type="submit">
          <span>Search</span>
        </button>
      </form>
    
      <div class="loader" id="loader" aria-hidden="true">
        <span class="loader__frame"></span>
        <span class="loader__frame"></span>
        <span class="loader__frame"></span>
      </div>
    
      <ul class="gallery" id="gallery"></ul>
    </main>
    
    <footer class="footer">
      <p>Images served by <a href="https://pixabay.com/" target="_blank" rel="noopener">Pixabay</a></p>
    </footer>
    
  </body>
</html>
